version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-agent
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    environment:
      - FALKORDB_TIMEOUT=3000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  falkordb_data:
    driver: local
